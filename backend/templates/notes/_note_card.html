<div class="card p-5 group hover:shadow-card-hover transition-all relative overflow-hidden flex flex-col h-full"
    style="border-top: 4px solid {{ note.color|default:'#6366f1' }}">

    <div class="flex items-start justify-between mb-3">
        <span class="badge bg-surface-50 dark:bg-surface-800 text-surface-400 font-medium">
            {{ note.get_category_display|default:"Sans catégorie" }}
        </span>
        {% if note.is_pinned %}
        <i data-lucide="pin" class="w-3.5 h-3.5 text-brand-500 fill-brand-500"></i>
        {% endif %}
    </div>

    <h3
        class="text-sm font-bold text-surface-900 dark:text-white mb-2 leading-snug group-hover:text-brand-600 transition-colors">
        {{ note.title }}
    </h3>

    <div class="text-xs text-surface-500 dark:text-surface-400 line-clamp-4 leading-relaxed mb-4 flex-1">
        {{ note.content|striptags }}
    </div>

    <div class="flex items-center justify-between pt-3 border-t border-surface-100 dark:border-surface-800">
        <span class="text-[10px] text-surface-400">{{ note.updated_at|date:"d M Y" }}</span>
        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-all">
            <a href="{% url 'note_edit' note.id %}"
                class="p-1.5 rounded-lg text-surface-400 hover:text-brand-600 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-all">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
            </a>
            <form method="post" action="{% url 'note_delete' note.id %}" class="inline">
                {% csrf_token %}
                <button type="submit" onclick="return confirm('Supprimer cette note ?')"
                    class="p-1.5 rounded-lg text-surface-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
            </form>
        </div>
    </div>
</div>
