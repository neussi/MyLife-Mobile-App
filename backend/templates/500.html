{% extends 'base.html' %}
{% load static %}

{% block title %}500 - Erreur Serveur | MyLife{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center p-6">
    <div
        class="w-24 h-24 rounded-3xl bg-red-50 dark:bg-red-900/20 flex items-center justify-center mb-8 shadow-xl shadow-red-500/10">
        <i data-lucide="alert-triangle" class="w-10 h-10 text-red-500"></i>
    </div>
    <h1 class="text-4xl font-bold text-neutral-900 dark:text-white mb-4" style="font-family:'Sora',sans-serif;">500</h1>
    <p class="text-lg text-neutral-500 dark:text-neutral-400 mb-8 max-w-md">
        Une erreur inattendue s'est produite. Nos ingénieurs (ou plutôt, moi l'IA) sont sur le coup. Réessayez dans
        quelques instants.
    </p>
    <a href="{% url 'dashboard' %}"
        class="btn px-8 py-3 bg-neutral-800 text-white font-bold rounded-2xl hover:bg-neutral-900 transition-all shadow-lg">
        Rafraîchir la Page
    </a>
</div>
{% endblock %}
