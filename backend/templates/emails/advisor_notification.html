<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: 'Sora', 'Segoe UI', sans-serif;
            background-color: #f7f9fc;
            color: #1e293b;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .header {
            padding: 40px;
            text-align: center;
        }

        .mood-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .content {
            padding: 40px;
            line-height: 1.6;
        }

        .footer {
            padding: 30px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #2563eb;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 20px;
        }

        /* Mood Dynamic Styles */
        .mood-happy {
            background-color: #f0fdf4;
            color: #16a34a;
        }

        .mood-concerned {
            background-color: #fffbeb;
            color: #d97706;
        }

        .mood-angry {
            background-color: #fef2f2;
            color: #dc2626;
        }

        .mood-furious {
            background-color: #450a0a;
            color: #fee2e2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <span class="mood-badge mood-{{ mood|lower }}">{{ mood_display }}</span>
            <h1 style="margin: 0; font-size: 24px; color: #0f172a;">{{ title }}</h1>
        </div>
        <div class="content">
            <p style="font-size: 18px; color: #334155; margin-bottom: 24px;">{{ greeting }}</p>
            <div style="background: #f1f5f9; padding: 24px; border-radius: 16px; border-left: 4px solid #2563eb;">
                {% for report in reports %}
                <p style="margin-bottom: 12px;">• {{ report.message }}</p>
                {% endfor %}
            </div>
            <a href="{{ site_url }}" class="btn">Réagir maintenant</a>
        </div>
        <div class="footer">
            <p>Cet email a été envoyé par votre Conseiller Expert MyLife.</p>
            <p style="font-size: 12px; margin-top: 10px;">Vous ne pouvez pas l'ignorer. C'est pour votre bien.</p>
        </div>
    </div>
</body>

</html>
