name: Deploy MyLife to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: "167.86.88.92"
        username: "root"
        password: "propenta2025"
        port: 22
        script: |
          mkdir -p /root/MyLife
          cd /root/MyLife
          # Initial setup if git not present or incomplete
          if [ ! -d .git ]; then
            git clone https://github.com/neussi/MyLife-Mobile-App.git .
          fi
          git pull origin main
          docker-compose down
          docker-compose up -d --build
          docker image prune -f
          
          # Apache Reverse Proxy & SSL Setup
          apt-get update && apt-get install -y certbot python3-certbot-apache
          cp mylife.conf /etc/apache2/sites-available/
          a2ensite mylife.conf
          a2enmod proxy proxy_http
          
          # Ensure Apache starts (even if it was stopped)
          systemctl start apache2 || systemctl restart apache2
          
          # Run certbot (non-interactive, agree to tos, provide email)
          # Use --apache but we must ensure port 80 is open and working
          certbot --apache -d mylife.boutik237.com --non-interactive --agree-tos -m npe.techs@gmail.com || echo "Certbot failed, but continuing..."
          
          # Final restart to apply SSL if certbot succeeded
          systemctl restart apache2
