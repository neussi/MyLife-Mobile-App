name: Deploy MyLife to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: "167.86.88.92"
        username: "root"
        password: "propental2025"
        port: 22
        script: |
          mkdir -p /root/MyLife
          cd /root/MyLife
          # Initial setup if git not present or incomplete
          if [ ! -d .git ]; then
            git clone https://github.com/neussi/MyLife-Mobile-App.git .
          fi
          git pull origin main
          docker-compose down
          docker-compose up -d --build
          docker image prune -f
