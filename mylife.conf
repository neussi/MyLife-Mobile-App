<VirtualHost *:80>
    ServerName mylife.boutik237.com
    Redirect permanent / https://mylife.boutik237.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName mylife.boutik237.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/mylife.boutik237.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mylife.boutik237.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:54321/
    ProxyPassReverse / http://127.0.0.1:54321/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog ${APACHE_LOG_DIR}/mylife_error.log
    CustomLog ${APACHE_LOG_DIR}/mylife_access.log combined
</VirtualHost>
